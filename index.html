<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garment Intake</title>
<style>
  :root{
    --bg:#f4f3f1; --card:#ffffff; --ink:#1c1a17; --muted:#7a746c;
    --accent:#8a5a3f; --accent-ink:#ffffff; --line:#e6e2dc; --danger:#b3432b; --ok:#3f7a52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #app{ width:100%; max-width:560px; }
  h1{ font-size:20px; margin:0 0 4px; letter-spacing:.2px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:20px; }
  .stepper{ display:flex; gap:6px; margin-bottom:18px; }
  .dot{ flex:1; height:5px; border-radius:3px; background:var(--line); transition:background .2s; }
  .dot.active{ background:var(--accent); }
  .dot.done{ background:#c9a488; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .stage-title{ font-size:17px; font-weight:600; margin:0 0 4px; }
  .stage-hint{ color:var(--muted); font-size:13px; margin:0 0 18px; }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=url], select{
    width:100%; padding:14px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:16px; background:#fbfaf9; color:var(--ink); margin-bottom:14px;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  button{
    font-size:15px; font-weight:600; border:none; border-radius:10px; padding:14px 18px;
    cursor:pointer; transition:opacity .15s;
  }
  button:active{ opacity:.8; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); width:100%; }
  .btn-secondary{ background:#efece7; color:var(--ink); }
  .btn-ghost{ background:transparent; color:var(--muted); padding:10px; }
  .btn-danger{ background:#f6e4de; color:var(--danger); }
  .nav-row{ display:flex; gap:10px; margin-top:18px; }
  .nav-row .btn-secondary{ flex:0 0 auto; }
  .nav-row .btn-primary{ flex:1; }
  .cam-frame{
    width:100%; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; margin-bottom:14px; position:relative;
  }
  .cam-frame img, .cam-frame canvas, .cam-frame video{ width:100%; height:100%; object-fit:contain; display:block; }
  .cam-placeholder{ color:#8a8580; font-size:13px; text-align:center; padding:20px; }
  .thumb-wrap{ position:relative; }
  .badge{
    position:absolute; top:10px; left:10px; background:rgba(0,0,0,.55); color:#fff;
    font-size:11px; padding:3px 8px; border-radius:20px;
  }
  .msg{ font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
  .msg.err{ background:#f6e4de; color:var(--danger); }
  .msg.ok{ background:#e2efe5; color:var(--ok); }
  .msg.info{ background:#eef0f5; color:#4a5568; }
  .fallback{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .fallback label{ margin-top:4px; }
  .review-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .review-row span:first-child{ color:var(--muted); }
  .top-bar{ display:flex; justify-content:space-between; align-items:flex-start; }
  .gear{ background:transparent; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; color:var(--muted); }
  .hidden{ display:none !important; }
  .settings-field{ margin-bottom:16px; }
  .log{ margin-top:18px; }
  .log-item{ font-size:12px; color:var(--muted); padding:6px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .count-pill{ display:inline-block; background:#eef0f5; color:#4a5568; font-size:12px; padding:4px 10px; border-radius:20px; margin-bottom:14px; }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div>
      <h1>Garment Intake</h1>
      <div class="sub">Photo, measurements &amp; color → Google Sheet</div>
    </div>
    <button class="gear" onclick="toggleSettings()">⚙ Settings</button>
  </div>

  <div class="stepper" id="stepper"></div>

  <!-- SETTINGS PANEL -->
  <div class="card hidden" id="settingsPanel">
    <div class="stage-title">Settings</div>
    <div class="stage-hint">These are saved on this computer only.</div>
    <div class="settings-field">
      <label>Camera source</label>
      <select id="cameraModeInput" onchange="onCameraModeChange()">
        <option value="webcam">This computer's camera (built-in or USB)</option>
        <option value="phone">Phone app streaming over WiFi</option>
      </select>
    </div>
    <div class="settings-field" id="webcamDeviceField">
      <label>Camera device</label>
      <select id="webcamDeviceInput">
        <option value="">Default camera</option>
      </select>
      <button class="btn-secondary" style="width:100%;" type="button" onclick="refreshDeviceList()">Refresh camera list</button>
    </div>
    <div class="settings-field hidden" id="phoneUrlField">
      <label>Phone camera stream URL (e.g. http://192.168.1.x:8080/video)</label>
      <input type="text" id="cameraUrlInput" placeholder="http://192.168.1.42:8080/video">
    </div>
    <div class="settings-field">
      <label>Google Apps Script Web App URL</label>
      <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <button class="btn-primary" onclick="saveSettings()">Save settings</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px;" onclick="toggleSettings()">Close</button>
  </div>

  <!-- MAIN WIZARD -->
  <div class="card" id="wizard"></div>

  <div class="log" id="log"></div>
</div>

<canvas id="captureCanvas" class="hidden"></canvas>

<script>
const STAGES = ['camera','waist','length','hem','color','review'];
let stageIndex = 0;
let entry = { photoDataUrl: null, waist:'', length:'', hem:'', color:'' };
let sessionLog = [];

const settings = {
  cameraMode: localStorage.getItem('gi_cameraMode') || 'webcam',
  cameraUrl: localStorage.getItem('gi_cameraUrl') || '',
  webcamDeviceId: localStorage.getItem('gi_webcamDeviceId') || '',
  scriptUrl: localStorage.getItem('gi_scriptUrl') || ''
};

let webcamStream = null;

function toggleSettings(){
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('hidden');
  const isOpen = !panel.classList.contains('hidden');
  if(!isOpen) return;
  document.getElementById('cameraModeInput').value = settings.cameraMode;
  document.getElementById('cameraUrlInput').value = settings.cameraUrl;
  document.getElementById('scriptUrlInput').value = settings.scriptUrl;
  onCameraModeChange();
  if(settings.cameraMode === 'webcam') refreshDeviceList();
}

function onCameraModeChange(){
  const mode = document.getElementById('cameraModeInput').value;
  document.getElementById('webcamDeviceField').classList.toggle('hidden', mode !== 'webcam');
  document.getElementById('phoneUrlField').classList.toggle('hidden', mode !== 'phone');
}

async function refreshDeviceList(){
  const sel = document.getElementById('webcamDeviceInput');
  try{
    // Ask for permission first so device labels are populated
    const tmp = await navigator.mediaDevices.getUserMedia({ video:true });
    tmp.getTracks().forEach(t=>t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d=>d.kind==='videoinput');
    sel.innerHTML = '<option value="">Default camera</option>' +
      cams.map(c=>`<option value="${c.deviceId}" ${c.deviceId===settings.webcamDeviceId?'selected':''}>${c.label||'Camera'}</option>`).join('');
  }catch(e){
    sel.innerHTML = '<option value="">Default camera (permission needed)</option>';
  }
}

function saveSettings(){
  settings.cameraMode = document.getElementById('cameraModeInput').value;
  settings.cameraUrl = document.getElementById('cameraUrlInput').value.trim();
  settings.webcamDeviceId = document.getElementById('webcamDeviceInput').value;
  settings.scriptUrl = document.getElementById('scriptUrlInput').value.trim();
  localStorage.setItem('gi_cameraMode', settings.cameraMode);
  localStorage.setItem('gi_cameraUrl', settings.cameraUrl);
  localStorage.setItem('gi_webcamDeviceId', settings.webcamDeviceId);
  localStorage.setItem('gi_scriptUrl', settings.scriptUrl);
  toggleSettings();
  render();
}

function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STAGES.map((s,i)=>{
    let cls='dot';
    if(i<stageIndex) cls+=' done';
    if(i===stageIndex) cls+=' active';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function goNext(){ stopWebcam(); if(stageIndex<STAGES.length-1){ stageIndex++; render(); } }
function goBack(){ stopWebcam(); if(stageIndex>0){ stageIndex--; render(); } }

function render(){
  renderStepper();
  const stage = STAGES[stageIndex];
  const w = document.getElementById('wizard');
  if(stage==='camera') w.innerHTML = cameraStage();
  else if(stage==='waist') w.innerHTML = numberStage('waist','Waist','e.g. 32','in inches or cm — be consistent');
  else if(stage==='length') w.innerHTML = numberStage('length','Length','e.g. 40','inseam or full length, your call');
  else if(stage==='hem') w.innerHTML = numberStage('hem','Hem','e.g. 14','hem opening width');
  else if(stage==='color') w.innerHTML = numberStage('color','Color','e.g. Blue','used to build the product title','text');
  else if(stage==='review') w.innerHTML = reviewStage();
  renderLog();
  attachHandlers();
  if(stage==='camera') startWebcamIfNeeded();
}

function cameraStage(){
  if(!entry.photoDataUrl){
    if(settings.cameraMode === 'webcam'){
      return `
        <div class="stage-title">1. Camera</div>
        <div class="stage-hint">Using this computer's camera. Capture a frame when ready.</div>
        <div class="cam-frame">
          <video id="webcamVideo" autoplay playsinline muted></video>
        </div>
        <div class="row">
          <button class="btn-secondary" onclick="toggleSettings()">⚙ Camera settings</button>
          <button class="btn-primary" onclick="captureFromWebcam()">Capture photo</button>
        </div>
        <div id="camMsg"></div>
        <div class="fallback">
          <label>Or upload a photo file instead</label>
          <input type="file" accept="image/*" id="fileFallback" onchange="handleFileUpload(event)">
        </div>
      `;
    }
    const hasUrl = !!settings.cameraUrl;
    return `
      <div class="stage-title">1. Camera</div>
      <div class="stage-hint">${hasUrl ? 'Live feed from your phone. Capture a frame when ready.' : 'No camera stream URL set — open Settings to add your phone\'s stream URL.'}</div>
      <div class="cam-frame">
        ${hasUrl ? `<img id="streamImg" src="${settings.cameraUrl}" crossorigin="anonymous" onerror="this.replaceWith(camErrorNode())">` : `<div class="cam-placeholder">Set a camera stream URL in Settings ⚙</div>`}
      </div>
      <div class="row">
        <button class="btn-secondary" onclick="toggleSettings()">⚙ Camera settings</button>
        <button class="btn-primary" ${hasUrl?'':'disabled'} onclick="capturePhoto()">Capture photo</button>
      </div>
      <div id="camMsg"></div>
      <div class="fallback">
        <label>Or upload a photo file instead</label>
        <input type="file" accept="image/*" id="fileFallback" onchange="handleFileUpload(event)">
      </div>
    `;
  }
  return `
    <div class="stage-title">1. Camera</div>
    <div class="stage-hint">Photo captured.</div>
    <div class="cam-frame thumb-wrap">
      <img src="${entry.photoDataUrl}">
      <div class="badge">Captured</div>
    </div>
    <div class="row">
      <button class="btn-secondary" onclick="retakePhoto()">Retake</button>
      <button class="btn-primary" onclick="goNext()">Continue</button>
    </div>
  `;
}

async function startWebcamIfNeeded(){
  if(settings.cameraMode !== 'webcam' || entry.photoDataUrl) return;
  const video = document.getElementById('webcamVideo');
  const msg = document.getElementById('camMsg');
  if(!video) return;
  try{
    const videoConstraints = {
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    };
    if(settings.webcamDeviceId) videoConstraints.deviceId = { exact: settings.webcamDeviceId };
    const constraints = { video: videoConstraints };
    webcamStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = webcamStream;
  }catch(e){
    if(msg) msg.innerHTML = `<div class="msg err">Couldn't access the camera (${e.message||e.name}). Check camera permissions for this browser, and that no other app is using the camera.</div>`;
  }
}

function stopWebcam(){
  if(webcamStream){
    webcamStream.getTracks().forEach(t=>t.stop());
    webcamStream = null;
  }
}

function captureFromWebcam(){
  const video = document.getElementById('webcamVideo');
  const msg = document.getElementById('camMsg');
  if(!video || !video.videoWidth){
    msg.innerHTML = `<div class="msg err">Camera isn't ready yet. Wait a second and try again.</div>`;
    return;
  }
  const canvas = document.getElementById('captureCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  entry.photoDataUrl = canvas.toDataURL('image/jpeg', 0.95);
  stopWebcam();
  render();
}

function camErrorNode(){
  const d = document.createElement('div');
  d.className = 'cam-placeholder';
  d.innerText = "Couldn't load the stream. Check the phone app is open and the URL/network is correct.";
  return d;
}

function capturePhoto(){
  const img = document.getElementById('streamImg');
  const msg = document.getElementById('camMsg');
  if(!img || !img.naturalWidth){
    msg.innerHTML = `<div class="msg err">Stream isn't loaded yet. Wait a moment and try again.</div>`;
    return;
  }
  const canvas = document.getElementById('captureCanvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  try{
    entry.photoDataUrl = canvas.toDataURL('image/jpeg', 0.85);
    render();
  }catch(e){
    msg.innerHTML = `<div class="msg err">Your camera app is blocking direct capture (no CORS access). Use the file upload option below instead — save a snapshot from the phone app and upload it.</div>`;
  }
}

function retakePhoto(){
  entry.photoDataUrl = null;
  render();
}

function handleFileUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { entry.photoDataUrl = e.target.result; render(); };
  reader.readAsDataURL(file);
}

function numberStage(key, label, placeholder, hint, inputmode){
  inputmode = inputmode || 'decimal';
  return `
    <div class="stage-title">${STAGES.indexOf(key)+1}. ${label}</div>
    <div class="stage-hint">${hint}</div>
    <label>${label}</label>
    <input type="text" inputmode="${inputmode}" id="input_${key}" placeholder="${placeholder}" value="${entry[key]}" autofocus>
    <div class="nav-row">
      <button class="btn-secondary" onclick="goBack()">Back</button>
      <button class="btn-primary" onclick="saveNumberAndNext('${key}')">Continue</button>
    </div>
  `;
}

function saveNumberAndNext(key){
  const val = document.getElementById('input_'+key).value.trim();
  if(!val){ alert('Please enter a value.'); return; }
  entry[key] = val;
  goNext();
}

function reviewStage(){
  return `
    <div class="stage-title">Review &amp; submit</div>
    <div class="stage-hint">Check everything before sending to the sheet.</div>
    <div class="cam-frame" style="aspect-ratio:auto;height:180px;">
      <img src="${entry.photoDataUrl || ''}">
    </div>
    <div class="review-row"><span>Waist</span><span>${entry.waist}</span></div>
    <div class="review-row"><span>Length</span><span>${entry.length}</span></div>
    <div class="review-row"><span>Hem</span><span>${entry.hem}</span></div>
    <div class="review-row"><span>Color</span><span>${entry.color}</span></div>
    <div id="submitMsg" style="margin-top:12px;"></div>
    <div class="nav-row">
      <button class="btn-secondary" onclick="goBack()">Back</button>
      <button class="btn-primary" id="submitBtn" onclick="submitEntry()">Submit to sheet</button>
    </div>
  `;
}

async function submitEntry(){
  const msg = document.getElementById('submitMsg');
  const btn = document.getElementById('submitBtn');
  if(!settings.scriptUrl){
    msg.innerHTML = `<div class="msg err">No Google Apps Script URL set. Open Settings ⚙ and paste it in.</div>`;
    return;
  }
  btn.disabled = true;
  msg.innerHTML = `<div class="msg info">Uploading…</div>`;
  try{
    const res = await fetch(settings.scriptUrl, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // avoids CORS preflight to Apps Script
      body: JSON.stringify({
        image: entry.photoDataUrl,
        waist: entry.waist,
        length: entry.length,
        hem: entry.hem,
        color: entry.color
      })
    });
    const data = await res.json();
    if(data.status === 'success'){
      msg.innerHTML = `<div class="msg ok">Saved to the sheet ✓</div>`;
      sessionLog.unshift({ time:new Date().toLocaleTimeString(), waist:entry.waist, length:entry.length, hem:entry.hem, color:entry.color });
      setTimeout(startNewEntry, 900);
    } else {
      msg.innerHTML = `<div class="msg err">Script error: ${data.message||'unknown error'}</div>`;
      btn.disabled = false;
    }
  }catch(err){
    msg.innerHTML = `<div class="msg err">Couldn't reach the sheet. Check your internet connection and Apps Script URL, then try again.</div>`;
    btn.disabled = false;
  }
}

function startNewEntry(){
  entry = { photoDataUrl:null, waist:'', length:'', hem:'', color:'' };
  stageIndex = 0;
  render();
}

function renderLog(){
  const el = document.getElementById('log');
  if(sessionLog.length===0){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="count-pill">${sessionLog.length} submitted this session</div>` +
    sessionLog.slice(0,5).map(l=>`<div class="log-item"><span>${l.time}</span><span>W ${l.waist} · L ${l.length} · H ${l.hem} · ${l.color}</span></div>`).join('');
}

function attachHandlers(){}

render();
</script>
</body>
</html>
